<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ntrophy Gateway</title>
<meta name="description" content="AI API 키 유출을 사용량 대조로 찾아내고 자동으로 차단하는 게이트웨이 관리 콘솔">
<meta name="theme-color" content="#eef2f5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css?v=5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='4' y='10' width='6.5' height='11' rx='1' fill='%23131416'/%3E%3Crect x='13.5' y='10' width='6.5' height='11' rx='1' fill='%23131416'/%3E%3Crect x='13.5' y='3' width='6.5' height='5.5' rx='1' fill='%23c4242a'/%3E%3C/svg%3E">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo">
      <!-- 마크: 게이트웨이 기록(왼쪽 막대)보다 높이 솟은 공급자 보고(오른쪽 막대), 넘친 부분이 '모르는 호출' -->
      <svg class="logo-mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="6.5" height="11" rx="1" fill="currentColor"/><rect x="13.5" y="10" width="6.5" height="11" rx="1" fill="currentColor"/><rect class="x" x="13.5" y="3" width="6.5" height="5.5" rx="1"/></svg>
      <div>Ntrophy Gateway<small>키 유출 탐지·자동 차단</small></div>
    </div>
    <nav id="nav" aria-label="주 메뉴"></nav>
    <div class="side-foot">
      <div class="nav-group">발표 화면</div>
      <a class="nav-btn" href="live.html" target="_blank" rel="noopener"><span data-ic="users"></span>청중 채팅</a>
      <a class="nav-btn" href="employee.html" target="_blank" rel="noopener"><span data-ic="user"></span>직원 채팅</a>
      <button class="btn block demo-side" id="demoBtn"><span data-ic="play"></span>데모 제어</button>
    </div>
  </aside>

  <div class="frame-main">
    <header class="topbar">
      <div class="crumb"><svg class="logo-mark m-only" viewBox="0 0 24 24" aria-label="Ntrophy Gateway"><rect x="4" y="10" width="6.5" height="11" rx="1" fill="currentColor"/><rect x="13.5" y="10" width="6.5" height="11" rx="1" fill="currentColor"/><rect class="x" x="13.5" y="3" width="6.5" height="5.5" rx="1"/></svg><span class="ws">데모 워크스페이스</span><span class="sep ws">/</span><b id="crumbPage">홈</b></div>
      <div class="spacer"></div>
      <button class="icon-btn" id="themeBtn" aria-label="화면 테마 바꾸기"></button>
      <button class="btn sm m-only" id="demoBtnM" aria-label="데모 제어"><span data-ic="play"></span></button>
      <button class="chip conn" id="connChip" title="서버 연결 설정"><span class="led"></span><span id="connText">실제 API 연결</span></button>
    </header>
    <main class="main">
      <div class="wrap">
        <div class="title-row"><div><h1 id="pageTitle">홈</h1><p id="pageSub"></p></div></div>
        <div id="banner"></div>
        <div id="view"></div>
      </div>
    </main>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="하단 메뉴"></nav>

<script src="js/sim.js?v=5"></script>
<script src="js/api.js?v=5"></script>
<script src="js/ui.js?v=5"></script>
<script src="js/console.js?v=5"></script>
</body>
</html>
